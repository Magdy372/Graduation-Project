spring.application.name=course-management-services
# Server Port 
server.port=8087

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
spring.cloud.config.enabled=false
eureka.instance.prefer-ip-address=true

# Logging

logging.level.org.springframework.web=warn
logging.level.com.example=debug
spring.main.banner-mode=off

#swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html



# Ensure proper access type
spring.jpa.properties.hibernate.mapping.default_access_type=field

#DB 
spring.datasource.url=jdbc:mysql://database-1.cduq02u6u14n.eu-north-1.rds.amazonaws.com:3306/DB
spring.datasource.username=admin
spring.datasource.password=Pathfinder_osra2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.bytecode.allow_enhancement_of_record_classes=true
logging.level.org.hibernate=DEBUG
# If using records, enable this property
spring.jpa.properties.hibernate.enhance.enable=true


# Enable multipart file uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Location to store uploaded files temporarily
spring.servlet.multipart.location=/tmp






spring.web.resources.static-locations=file:uploads/

